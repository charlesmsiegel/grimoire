; The type gate. Runs as `make check-mypy` locally and as the `mypy` CI job.
;
; Like ruff's, it does not run mypy directly: `scripts/ratchet.py` holds the
; tree to the per-(file, error-code) counts in `lint-baselines/mypy.json`, so
; the 244 errors that exist today are recorded rather than suppressed and a new
; one fails the build. That script's header has the argument in full.
;
; Settings are mypy's defaults plus the three below. Turning on `strict` (or
; even `disallow_untyped_defs`) would take the finding count from 244 to five
; figures, and a baseline that large stops being a list anyone reads.

[mypy]
; The floor `requires-python` declares, not whichever interpreter is running.
; The `backend` CI job runs the suite on 3.11 and 3.14; the version-conditional
; branches mypy takes must not depend on which one this happens to be.
python_version = 3.11
mypy_path = backend/src
; The shipped package only. `backend/tests` is 84k lines of pytest whose
; fixtures are dynamically typed on purpose; checking it would bury the 244
; findings that are about code users run.
files = backend/src/grimoire
; Off by default -- `PGH003` (blanket type-ignore) is selected in ruff.toml, so
; a suppression here has to name the code it suppresses.
warn_unused_ignores = True

; The four third-party packages with no type information. Named individually
; rather than setting `ignore_missing_imports` globally: a global one also
; silences a *first-party* module that fails to import, which is how a typo in
; `mypy_path` turns the whole gate green.
;
; `follow_imports = skip` on the two optional ones is what makes the baseline
; reproducible. `tiktoken` is in the `desktop` extra and `claude_agent_sdk` in
; `claude`; the installer puts `desktop` in `backend/.venv` and CI does not, so
; without this the same commit would type-check differently on a contributor's
; machine and on the runner.
[mypy-tiktoken.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-claude_agent_sdk.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-markdown.*]
ignore_missing_imports = True

[mypy-pyluach.*]
ignore_missing_imports = True
