id: export-single-markdown
name: "Single-File Markdown Export"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
description: |
  Concatenates the entire campaign into one CommonMark file with TOC
  anchors. Suitable for quick sharing where a directory tree is overkill.

implements:
  - export_adapter

classes:
  export_adapter: SingleMarkdownAdapter

config_schema:
  type: object
  properties:
    data_root:
      type: string
      title: Campaign data root
      description: Filesystem root that contains ``campaigns/<id>/``.
  additionalProperties: false

requirements: []

notes: |
  Posts inherit the same filter pipeline as the bundle adapter; mechanics
  annotations remain inline unless ``strip_mechanics`` is set.
