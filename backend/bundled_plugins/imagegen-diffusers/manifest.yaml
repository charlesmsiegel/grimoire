id: imagegen-diffusers
name: "Diffusers ImageGen Backend"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://huggingface.co/docs/diffusers"
description: |
  Runs HuggingFace `diffusers` pipelines in-process so any SDXL / SD3 /
  Flux / SD1.5 checkpoint on the Hub (or a local path) can generate
  images without standing up a separate API server.

  The pipeline is loaded lazily on first `generate()` call and cached
  for the life of the plugin instance. Schedulers can be swapped per
  request via the standard sampler names (e.g. "DPM++ 2M Karras",
  "Euler a"). Gated repositories require an `hf_token`.

implements:
  - imagegen_backend

classes:
  imagegen_backend: DiffusersImageGenBackend

config_schema:
  type: object
  properties:
    active_model:
      type: string
      title: Active model
      description: |
        HuggingFace model id (or absolute local path) to load. Picked from
        a curated catalog of popular SDXL / SD3 / Flux / SD1.5 checkpoints;
        any other id can be entered as free text.
      default: "stabilityai/stable-diffusion-xl-base-1.0"
      x-source: models
    device:
      type: string
      title: Device
      description: |
        Torch device override. "auto" picks CUDA if available, then MPS
        (Apple Silicon), otherwise CPU.
      default: "auto"
      enum: ["auto", "cuda", "mps", "cpu"]
    dtype:
      type: string
      title: Weight precision
      description: |
        Tensor precision for the loaded pipeline. "auto" uses float16 on
        CUDA and bfloat16 on MPS; CPU always runs in float32 regardless.
        float16 roughly halves VRAM but a few models (SD3, some Flux
        variants) prefer bfloat16.
      default: "auto"
      enum: ["auto", "float16", "bfloat16", "float32"]
    variant:
      type: string
      title: Weights variant
      description: |
        Optional HuggingFace `variant` for checkpoints that ship split
        weight files — e.g. "fp16" for SDXL base. Leave empty for the
        default variant.
    default_scheduler:
      type: string
      title: Default scheduler
      description: |
        Scheduler used when a generation request doesn't pin one. Names
        match the a1111 / ComfyUI conventions and are mapped to the
        equivalent diffusers scheduler class.
      default: "DPM++ 2M Karras"
      enum:
        - "DPM++ 2M Karras"
        - "DPM++ 2M"
        - "DPM++ SDE Karras"
        - "Euler a"
        - "Euler"
        - "Heun"
        - "LMS"
        - "DDIM"
        - "DDPM"
        - "UniPC"
        - "PNDM"
        - "DEIS"
    attention_slicing:
      type: boolean
      title: Attention slicing
      description: |
        Trade a small amount of throughput for materially lower VRAM by
        slicing attention. Recommended on cards with <12 GB VRAM.
      default: true
    vae_slicing:
      type: boolean
      title: VAE slicing
      description: |
        Decode VAE in slices instead of one pass. Helps at batch_size>1
        and high resolutions; harmless otherwise.
      default: true
    vae_tiling:
      type: boolean
      title: VAE tiling
      description: |
        Tile the VAE decode pass so images above 1024×1024 fit in memory.
        Off by default — turn on for very high-resolution generations.
      default: false
    cpu_offload:
      type: boolean
      title: Sequential CPU offload
      description: |
        Move pipeline components to CPU between sub-steps so generation
        fits in tiny VRAM budgets. Significantly slower; only enable on
        cards with <8 GB VRAM.
      default: false
    safety_checker:
      type: boolean
      title: Safety checker
      description: |
        Keep the upstream NSFW safety checker on SD1.5-class pipelines.
        Disabled by default because it occasionally returns blank images
        and adds latency; SDXL / SD3 / Flux pipelines don't ship one.
      default: false
    cache_folder:
      type: string
      title: Cache folder
      description: |
        Local directory weights are downloaded to. Leave blank to use the
        default HuggingFace cache (`HF_HOME` / `~/.cache/huggingface`).
    hf_token:
      type: string
      title: HuggingFace token
      description: |
        Token used to download gated models (FLUX.1-dev, SD3, SD3.5). Get
        one at https://huggingface.co/settings/tokens.
      secret: true
    timeout_seconds:
      type: number
      title: Generate timeout (seconds)
      description: |
        Hard ceiling on a single `generate()` call. Generous default
        because the first call also downloads weights.
      default: 600
      minimum: 1
  additionalProperties: false

requirements:
  - "diffusers>=0.30"
  - "torch>=2.1"
  - "transformers>=4.40"
  - "accelerate>=0.30"
  - "Pillow>=10.0"

notes: |
  First generation downloads the model from HuggingFace and may take
  several minutes; subsequent generations reuse the in-memory pipeline.
  Gated checkpoints (FLUX.1-dev, Stable Diffusion 3 / 3.5) require both
  an `hf_token` set here and a one-time license acceptance on the
  model's HuggingFace page.
