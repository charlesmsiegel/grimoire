id: imagegen-replicate
name: "Replicate ImageGen Backend"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://replicate.com/docs/reference/http"
description: |
  Adapter for Replicate-hosted image models. Maps Grimoire's
  `GenerationRequest` onto Replicate's prediction API and downloads the
  returned image URL.

  The `default_model` can either be a fully-pinned reference
  (`owner/name:version`) — submitted via `POST /v1/predictions` — or a
  loose `owner/name` reference — submitted via
  `POST /v1/models/{owner}/{name}/predictions`, which Replicate resolves
  to the model's latest official version.

  Replicate models vary widely in their input schemas, so requests carry
  only the inputs whose meanings are consistent across the popular
  text-to-image models (`prompt`, `negative_prompt`, `width`, `height`,
  `seed`, `num_inference_steps`, `guidance_scale`, `scheduler`).
  Extra per-model inputs can be passed through `GenerationRequest.extra`.

implements:
  - imagegen_backend

classes:
  imagegen_backend: ReplicateImageGenBackend

config_schema:
  type: object
  required: [api_token]
  properties:
    api_token:
      type: string
      title: API token
      description: Replicate API token (r8_...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the Replicate API base URL.
      default: "https://api.replicate.com/v1"
    default_model:
      type: string
      title: Default model
      description: |
        Replicate model reference used when a request omits `model`.
        Either `owner/name` (latest official version) or
        `owner/name:version` (pinned to a specific version hash).
      default: "black-forest-labs/flux-schnell"
    poll_interval_seconds:
      type: number
      title: Poll interval (seconds)
      default: 1.0
      minimum: 0.1
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 300
      minimum: 1
    wait_seconds:
      type: integer
      title: Inline-wait hint (seconds)
      description: |
        Replicate's `Prefer: wait=N` hint asks the API to hold the
        connection open up to N seconds before returning. Set to 0 to
        disable and always poll.
      default: 30
      minimum: 0
      maximum: 60
  additionalProperties: false

requirements:
  - "httpx>=0.27"

notes: |
  Requires a Replicate API token. The plugin sends each model only the
  inputs it advertises through the common SDXL/Flux schema; pass
  additional model-specific inputs (e.g. `aspect_ratio`, `output_format`,
  `output_quality`) through `GenerationRequest.extra` and they will be
  merged into the prediction payload.
