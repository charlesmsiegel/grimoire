id: llm-zhipu-glm
name: "Zhipu GLM LLM Provider"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://open.bigmodel.cn"
description: |
  Routes completions to Zhipu AI's GLM family (GLM-4, GLM-4.5, GLM-4.6,
  GLM-4-Air, GLM-4-Flash, ChatGLM, etc.). Supports both pay-as-you-go
  billing on the BigModel platform and Zhipu's coding-plan subscriptions
  via api.z.ai. The wire protocol is OpenAI-compatible.

implements:
  - llm_provider

classes:
  llm_provider: ZhipuGLMLLMProvider

config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      description: |
        Zhipu AI / Z.AI API key. Get one from https://open.bigmodel.cn (pay-as-you-go)
        or https://z.ai (subscription). Stored in the OS keyring when available.
      secret: true
    plan:
      type: string
      title: Subscription plan
      description: |
        Pick the endpoint matching your account. "pay-as-you-go" hits
        open.bigmodel.cn (international: api.z.ai/api/paas). "coding-plan"
        and "glm-coding-plan" hit the api.z.ai coding endpoint which is
        billed against your Z.AI Coding Plan subscription instead of
        token credits. "custom" defers to `base_url`.
      enum: ["pay-as-you-go", "coding-plan", "glm-coding-plan", "custom"]
      default: "pay-as-you-go"
    base_url:
      type: string
      title: Base URL
      description: |
        Overrides the endpoint derived from `plan`. Useful for self-hosted
        proxies or new endpoints that ship before this plugin is updated.
    default_model:
      type: string
      title: Default model
      description: |
        Model id used when a request does not specify one. Examples:
        `glm-4.6`, `glm-4.5`, `glm-4.5-air`, `glm-4-plus`, `glm-4-flash`.
      default: "glm-4.6"
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 120
    extra_headers:
      type: object
      title: Extra headers
      description: Arbitrary headers attached to every request (advanced).
      additionalProperties:
        type: string
  required: [api_key]
  additionalProperties: false

requirements:
  - "httpx>=0.27.0"

notes: |
  Plan endpoints (override with `base_url`):
    pay-as-you-go     → https://open.bigmodel.cn/api/paas/v4
    coding-plan       → https://api.z.ai/api/coding/paas/v4
    glm-coding-plan   → https://api.z.ai/api/coding/paas/v4
    custom            → uses `base_url` verbatim
  The newer GLM API keys are accepted as Bearer tokens directly; legacy
  `{id}.{secret}` keys also work without client-side JWT signing.
