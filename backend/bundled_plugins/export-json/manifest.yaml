id: export-json
name: "JSON Export"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
description: |
  Dumps the campaign's structured state (scenes, posts, cast, world,
  images) to a single JSON file. Useful for backups, migrations, and
  feeding the data into other tools.

implements:
  - export_adapter

classes:
  export_adapter: JsonExportAdapter

config_schema:
  type: object
  properties:
    data_root:
      type: string
      title: Campaign data root
      description: Filesystem root that contains ``campaigns/<id>/``.
    pretty_print:
      type: boolean
      title: Pretty-print JSON
      description: Indent the output for human readability.
      default: true
    include_embeddings:
      type: boolean
      title: Include embeddings
      description: Embed fact/post vector embeddings in the dump (large).
      default: false
  additionalProperties: false

requirements: []

notes: |
  This adapter does not redact secrets. Treat the output as sensitive.
