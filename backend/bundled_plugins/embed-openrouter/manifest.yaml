id: embed-openrouter
name: "OpenRouter Embeddings"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://openrouter.ai"
description: |
  Routes embeddings through OpenRouter's OpenAI-compatible `/embeddings`
  endpoint so any of the embedding models exposed by openrouter.ai can be
  used with a single API key. Models are addressed by their OpenRouter
  slug (e.g. `openai/text-embedding-3-small`, `mistralai/mistral-embed`).

implements:
  - embedding_provider

classes:
  embedding_provider: OpenRouterEmbeddingProvider

shares_secrets_with:
  - llm-openrouter

config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      description: OpenRouter API key (sk-or-...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the API base URL (useful for proxies or self-hosted gateways).
      default: "https://openrouter.ai/api/v1"
    active_model:
      type: string
      title: Active model
      description: |
        OpenRouter model slug Grimoire will embed with. Picked from the live
        catalog at https://openrouter.ai/models, filtered to embedding
        models.
      default: "openai/text-embedding-3-small"
      x-source: models
    dimensions:
      type: integer
      minimum: 1
      title: Dimensions
      description: |
        Truncate the embedding to this length. Only honoured by models
        that support a `dimensions` request parameter (mostly OpenAI's
        `text-embedding-3-*` family). Leave unset to use the model's
        native dimension count.
    http_referer:
      type: string
      title: HTTP-Referer header
      description: |
        Optional referer string sent on requests. OpenRouter uses this to
        attribute traffic on its leaderboard; leave blank if you don't care.
    app_title:
      type: string
      title: App title (X-Title header)
      description: Friendly app name shown on the OpenRouter dashboard.
      default: "Grimoire"
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 60
    extra_headers:
      type: object
      title: Extra headers
      description: Arbitrary headers to attach to every request (advanced).
      additionalProperties:
        type: string
  required: [api_key]
  additionalProperties: false

requirements:
  - "httpx>=0.27.0"

notes: |
  Get an API key at https://openrouter.ai/keys. The list of embedding
  models is fetched from OpenRouter's `/models` endpoint and filtered to
  rows whose architecture reports an `embedding` output modality (with a
  small fallback list when filtering yields nothing).
