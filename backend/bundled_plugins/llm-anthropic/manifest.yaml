id: llm-anthropic
name: "Anthropic LLM Provider"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://www.anthropic.com"
description: |
  Adapts the Anthropic Messages API for Grimoire's LLM Gateway. Supports
  streaming, system prompts, stop sequences, and the Claude 4 family.

implements:
  - llm_provider

classes:
  llm_provider: AnthropicLLMProvider

config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      description: Anthropic API key (sk-ant-...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the API base URL (useful for proxies).
      default: "https://api.anthropic.com"
    default_model:
      type: string
      title: Default model
      description: Used when a request does not specify a model.
      default: "claude-opus-4-7"
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 120
  required: [api_key]
  additionalProperties: false

requirements:
  - "anthropic>=0.40.0"

notes: |
  Requires an API key from https://console.anthropic.com. Costs are tracked
  per request when the model is in the built-in pricing table; otherwise
  cost_estimate_usd is left unset and the Gateway uses only token counts.
