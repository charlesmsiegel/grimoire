id: imagegen-dalle
name: "OpenAI DALL-E ImageGen Backend"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://platform.openai.com/docs/guides/images"
description: |
  Adapter for OpenAI's image generation API. Supports `dall-e-3`,
  `dall-e-2`, and `gpt-image-1`. Maps Grimoire's `GenerationRequest`
  fields onto the OpenAI request shape and decodes the returned base64
  PNG bytes.

  Note: DALL-E does not support arbitrary samplers / seeds, so
  `list_samplers` returns an empty list and `seed` in the request is
  ignored (the model returns its own seed, which is recorded in
  `actual_params`).

implements:
  - imagegen_backend

classes:
  imagegen_backend: DalleImageGenBackend

config_schema:
  type: object
  required: [api_key]
  properties:
    api_key:
      type: string
      title: API key
      description: OpenAI API key (sk-...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the API base URL (Azure / proxies).
      default: "https://api.openai.com/v1"
    default_model:
      type: string
      title: Default model
      description: Used when a request does not specify a model.
      default: "dall-e-3"
      enum:
        - "dall-e-3"
        - "dall-e-2"
        - "gpt-image-1"
    quality:
      type: string
      title: Quality
      description: Image quality for `dall-e-3` ("standard" or "hd").
      default: "standard"
      enum: ["standard", "hd"]
    style:
      type: string
      title: Style
      description: Image style for `dall-e-3` ("vivid" or "natural").
      default: "vivid"
      enum: ["vivid", "natural"]
    organization:
      type: string
      title: OpenAI organization
      description: Optional `OpenAI-Organization` header.
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 120
      minimum: 1
  additionalProperties: false

requirements:
  - "httpx>=0.27"

notes: |
  Requires an OpenAI API key. Resolution is clamped to the nearest
  size the model supports (`1024x1024`, `1792x1024`, or `1024x1792`
  for `dall-e-3`; `256x256` / `512x512` / `1024x1024` for `dall-e-2`).
  Negative prompts are appended to the prompt as "Avoid: ..." because
  the OpenAI API doesn't accept a dedicated negative_prompt field.
