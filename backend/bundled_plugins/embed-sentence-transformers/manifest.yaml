id: embed-sentence-transformers
name: Sentence-Transformers Embeddings
version: 1.0.0
api_version: "1"
author: Grimoire
description: >
  Local embedding provider backed by the `sentence-transformers` library.
  Loads a HuggingFace model on first use and runs `encode()` in a thread
  pool so the event loop is never blocked.
implements:
  - embedding_provider
classes:
  embedding_provider: SentenceTransformersEmbeddingProvider
requirements:
  - sentence-transformers>=3.0
  - torch>=2.0
config_schema:
  type: object
  properties:
    active_model:
      type: string
      title: Active model
      description: |
        HuggingFace model id loadable by SentenceTransformer. Picked from a
        curated list of popular embedding models; any other HF id (or an
        absolute path to a local checkpoint) can be entered as free text.
      default: sentence-transformers/all-mpnet-base-v2
      x-source: models
    device:
      type: string
      title: Device
      description: Torch device override ("cpu", "cuda", "mps"). Auto-detected when omitted.
    normalize:
      type: boolean
      title: Normalize vectors
      description: L2-normalise output vectors so cosine similarity equals dot product.
      default: true
    batch_size:
      type: integer
      title: Batch size
      minimum: 1
      default: 32
    cache_folder:
      type: string
      title: Cache folder
      description: Local directory the model is downloaded to. Defaults to HuggingFace's cache.
  additionalProperties: false
