id: embed-llamacpp
name: "llama.cpp Embeddings"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://github.com/abetlen/llama-cpp-python"
description: |
  Local embedding provider that loads a GGUF model via `llama-cpp-python`.
  Runs entirely offline with no API calls. Supports any GGUF embedding
  model (nomic-embed, BGE, E5, etc.) and offloads to GPU when configured.

implements:
  - embedding_provider

classes:
  embedding_provider: LlamaCppEmbeddingProvider

config_schema:
  type: object
  properties:
    model_path:
      type: string
      title: Model path
      description: Absolute path to a GGUF embedding model file on disk.
    n_ctx:
      type: integer
      title: Context window
      description: Maximum context size in tokens for the embedding model.
      default: 2048
      minimum: 64
    n_threads:
      type: integer
      title: CPU threads
      description: Threads for CPU inference. Leave unset for the library default.
      minimum: 1
    n_gpu_layers:
      type: integer
      title: GPU layers
      description: Number of layers to offload to GPU. 0 = CPU only, -1 = all layers.
      default: 0
    n_batch:
      type: integer
      title: Batch size
      description: Maximum number of texts to embed per llama.cpp call.
      default: 32
      minimum: 1
    normalize:
      type: boolean
      title: Normalize vectors
      description: L2-normalise output vectors so cosine similarity equals dot product.
      default: true
    model_id:
      type: string
      title: Display id
      description: Identifier reported by list_models and used for cache keys. Defaults to the file name.
  required: [model_path]
  additionalProperties: false

requirements:
  - "llama-cpp-python>=0.3.0"

notes: |
  Download a GGUF embedding model (e.g. from nomic-ai/nomic-embed-text-v2-moe-GGUF)
  and point `model_path` at it. The model is loaded lazily on the first embed call.
  For GPU offload, set `n_gpu_layers` to -1 (all layers) or a specific count, and
  install llama-cpp-python with the appropriate CUDA/Metal extras.
