id: export-markdown
name: "Markdown Bundle Export"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
description: |
  Exports a campaign as a directory tree of CommonMark files (scenes,
  characters, locations, lore, factions, continuity, image gallery)
  packaged into a single ``.zip`` for easy download. Re-extract to get
  the original tree from spec 13.

implements:
  - export_adapter

classes:
  export_adapter: MarkdownBundleAdapter

config_schema:
  type: object
  properties:
    data_root:
      type: string
      title: Campaign data root
      description: Filesystem root that contains ``campaigns/<id>/``. Defaults to the app's data root.
    include_images:
      type: boolean
      title: Include image binaries
      description: Copy generated images into the bundle (off keeps the archive small).
      default: true
  additionalProperties: false

requirements: []

notes: |
  The adapter follows the layout in spec 13: ``scenes/``, ``characters/``,
  ``world/``, ``continuity/``, ``images/`` plus a ``README.md`` index.
