id: llm-openrouter
name: "OpenRouter LLM Provider"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://openrouter.ai"
description: |
  Routes completions through OpenRouter's OpenAI-compatible API so any of
  the hundreds of models on openrouter.ai can be used as a Grimoire
  provider with a single API key. Models are addressed by their OpenRouter
  slug (e.g. `anthropic/claude-opus-4-7`, `openai/gpt-4o`,
  `meta-llama/llama-3.1-70b-instruct`).

implements:
  - llm_provider

classes:
  llm_provider: OpenRouterLLMProvider

shares_secrets_with:
  - embed-openrouter

config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      description: OpenRouter API key (sk-or-...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the API base URL (useful for proxies or self-hosted gateways).
      default: "https://openrouter.ai/api/v1"
    active_model:
      type: string
      title: Active model
      description: |
        OpenRouter model slug Grimoire will route completions to. Picked
        from the live catalog at https://openrouter.ai/models.
      default: "anthropic/claude-sonnet-4-6"
      x-source: models
    http_referer:
      type: string
      title: HTTP-Referer header
      description: |
        Optional referer string sent on requests. OpenRouter uses this to
        attribute traffic on its leaderboard; leave blank if you don't care.
    app_title:
      type: string
      title: App title (X-Title header)
      description: Friendly app name shown on the OpenRouter dashboard.
      default: "Grimoire"
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 120
    extra_headers:
      type: object
      title: Extra headers
      description: Arbitrary headers to attach to every request (advanced).
      additionalProperties:
        type: string
    provider:
      type: object
      title: Provider routing (default)
      description: |
        OpenRouter `provider` routing applied to every request. Leave every
        field blank to defer entirely to OpenRouter's own/account routing and
        pricing (nothing is sent). Set fields to constrain which upstream
        provider serves a model and to cap per-token price.
      additionalProperties: true
      properties:
        sort:
          type: string
          title: Sort
          description: Order candidate providers by price, throughput, or latency.
          enum: [price, throughput, latency]
        allow_fallbacks:
          type: boolean
          title: Allow fallbacks
          description: Fall back to a pricier/slower provider when the preferred one is unavailable.
        order:
          type: array
          title: Provider order
          description: Preferred provider slugs, tried in order.
          items:
            type: string
        only:
          type: array
          title: Only these providers
          items:
            type: string
        ignore:
          type: array
          title: Ignore these providers
          items:
            type: string
        require_parameters:
          type: boolean
          title: Require parameters
          description: Only route to providers that support all request parameters.
        data_collection:
          type: string
          title: Data collection
          description: Allow or deny providers that may train on prompts.
          enum: [allow, deny]
        max_price:
          type: object
          title: Max price (USD per million tokens)
          additionalProperties: false
          properties:
            prompt:
              type: number
              title: Prompt
            completion:
              type: number
              title: Completion
    provider_overrides:
      type: object
      title: Per-model provider routing
      description: |
        Map of model slug -> provider routing object, merged over the default
        for that model (nested objects such as `max_price` merge field-by-field).
        Use it to constrain or price-cap specific models; models you don't list
        defer to the default routing above.
      additionalProperties:
        type: object
        additionalProperties: true
    usage_accounting:
      type: boolean
      title: Usage accounting
      description: |
        Ask OpenRouter to return the actual charged cost on every response
        (`usage: {include: true}`) so logs and cost records reflect the real
        charge rather than catalog estimates. Disable — together with
        `provider: {}` — when `base_url` points at a strict OpenAI-compatible
        gateway that rejects OpenRouter-only request fields.
      default: true
  required: [api_key]
  additionalProperties: false

requirements:
  - "httpx>=0.27.0"

notes: |
  Get an API key at https://openrouter.ai/keys. Per-model pricing is fetched
  lazily from the OpenRouter `/models` endpoint and reflected in
  `list_models()`; if the call fails the provider still works but cost
  estimates are unavailable for unknown models.
