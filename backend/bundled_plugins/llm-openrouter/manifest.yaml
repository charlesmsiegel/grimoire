id: llm-openrouter
name: "OpenRouter LLM Provider"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://openrouter.ai"
description: |
  Routes completions through OpenRouter's OpenAI-compatible API so any of
  the hundreds of models on openrouter.ai can be used as a Grimoire
  provider with a single API key. Models are addressed by their OpenRouter
  slug (e.g. `anthropic/claude-opus-4-7`, `openai/gpt-4o`,
  `meta-llama/llama-3.1-70b-instruct`).

implements:
  - llm_provider

classes:
  llm_provider: OpenRouterLLMProvider

config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      description: OpenRouter API key (sk-or-...). Stored in the OS keyring when available.
      secret: true
    base_url:
      type: string
      title: Base URL
      description: Override the API base URL (useful for proxies or self-hosted gateways).
      default: "https://openrouter.ai/api/v1"
    active_model:
      type: string
      title: Active model
      description: |
        OpenRouter model slug Grimoire will route completions to. Picked
        from the live catalog at https://openrouter.ai/models.
      default: "anthropic/claude-sonnet-4-6"
      x-source: models
    http_referer:
      type: string
      title: HTTP-Referer header
      description: |
        Optional referer string sent on requests. OpenRouter uses this to
        attribute traffic on its leaderboard; leave blank if you don't care.
    app_title:
      type: string
      title: App title (X-Title header)
      description: Friendly app name shown on the OpenRouter dashboard.
      default: "Grimoire"
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 120
    extra_headers:
      type: object
      title: Extra headers
      description: Arbitrary headers to attach to every request (advanced).
      additionalProperties:
        type: string
  required: [api_key]
  additionalProperties: false

requirements:
  - "httpx>=0.27.0"

notes: |
  Get an API key at https://openrouter.ai/keys. Per-model pricing is fetched
  lazily from the OpenRouter `/models` endpoint and reflected in
  `list_models()`; if the call fails the provider still works but cost
  estimates are unavailable for unknown models.
