id: imagegen-comfyui
name: "ComfyUI ImageGen Backend"
version: "1.0.0"
api_version: "1"
author: "Grimoire core"
homepage: "https://github.com/comfyanonymous/ComfyUI"
description: |
  HTTP client for a ComfyUI server. Loads a workflow JSON template,
  fills in prompt / negative / sampler / steps / seed nodes, submits
  the workflow to `/prompt`, polls `/history/{id}` until completion,
  and downloads the generated image via `/view`.

  Custom workflows can be supplied per-architecture via `workflows_dir`
  — the plugin auto-discovers `*.json` files there. This is the escape
  valve when a new image-model architecture lands and ComfyUI's loader
  supports it before `diffusers` catches up (spec 12).

implements:
  - imagegen_backend

classes:
  imagegen_backend: ComfyUIImageGenBackend

config_schema:
  type: object
  properties:
    base_url:
      type: string
      title: Base URL
      description: ComfyUI server base URL, e.g. http://127.0.0.1:8188.
      default: "http://127.0.0.1:8188"
    workflows_dir:
      type: string
      title: Workflow directory
      description: |
        Filesystem path containing `*.json` workflow templates. Templates
        are matched by the request's `model` field (filename stem) and
        otherwise fall back to `default.json`. When unset the plugin
        synthesizes a minimal SDXL workflow at runtime.
    default_workflow:
      type: string
      title: Default workflow id
      description: Workflow stem to use when none is selected. Defaults to "default".
      default: "default"
    client_id:
      type: string
      title: Client id
      description: Optional `client_id` header for the websocket/prompt API.
    timeout_seconds:
      type: number
      title: Request timeout (seconds)
      default: 600
      minimum: 1
    poll_interval_seconds:
      type: number
      title: Poll interval (seconds)
      default: 1.0
      minimum: 0.05
    api_key:
      type: string
      title: API key
      description: Optional Bearer token for ComfyUI deployments behind a proxy.
      secret: true
  additionalProperties: false

requirements:
  - "httpx>=0.27"

notes: |
  Start ComfyUI with `python main.py --listen` to expose the HTTP API.
  Workflow templates use the ComfyUI "API format" JSON (the JSON saved
  via Settings → Enable Dev Mode → Save (API format)).
