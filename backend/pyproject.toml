[project]
name = "grimoire-v2"
version = "0.0.1"
description = "Grimoire V2 fiction-first domain core (pre-alpha)"
requires-python = ">=3.11"
dependencies = ["pyluach>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pocketsphinx==5.0.4"]  # 067's offline reference recognizer, tests only; 5.0.4 has wheels for every CI cell
#: 061's optional local speech recognizer (docs/SPEECH.md): free, offline, on-device. The same engine as dev's.
voice = ["pocketsphinx>=5.0.4,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Dumps tracebacks of a hung test; CI job timeouts are the hard stop. Windows CI waits 600 s
# instead (.github/workflows/ci.yml, docs/TESTING.md#ci-gate).
faulthandler_timeout = 120
