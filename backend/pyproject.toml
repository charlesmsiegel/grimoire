[project]
name = "grimoire"
version = "0.0.1"
description = "grimoire seed — OpenRouter chat with markdown state"
requires-python = ">=3.11"
# Base deps must stay Android-installable (pure python or Chaquopy-wheel'd).
# Desktop-only pieces — uvicorn's compiled extras and tiktoken (Rust wheel,
# count_tokens falls back to a heuristic without it) — live in the `desktop`
# extra. See docs/android-architecture.md §6-7 and android/app/build.gradle.kts.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "holidays>=0.40",
    "pyluach>=2.2",
    "pillow>=10.0",
    "jinja2>=3.1",
    "markdown>=3.5",
]

[project.optional-dependencies]
desktop = [
    "uvicorn[standard]>=0.29",
    "tiktoken>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
