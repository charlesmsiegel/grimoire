[project]
name = "grimoire"
version = "0.0.0"
description = "Local-first RPG campaign companion (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
    "watchdog>=4.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.hatch.build.targets.wheel.force-include]
"src/grimoire/templates" = "grimoire/templates"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "conformance: plugin conformance contract tests (spec 17 §L2)",
    "integration: cross-module integration tests (spec 17 §L3)",
    "frozen_campaign: regression tests over a frozen SQLite snapshot (spec 17 §L4)",
    "perf: performance regression benchmarks (spec 17 §Performance regression tests)",
]
