[project]
name = "grimoire-v2"
version = "0.0.1"
description = "Grimoire V2 fiction-first domain core (pre-alpha)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Dumps tracebacks of a hung test; CI job timeouts are the hard stop.
faulthandler_timeout = 120
