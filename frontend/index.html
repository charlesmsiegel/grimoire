<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- `interactive-widget=resizes-content`: when the on-screen keyboard
         opens, shrink the layout viewport rather than only the visual one, so
         the composer at the foot of a scene is pushed up above the keyboard
         instead of left behind it. The Android shell gets the same from
         `adjustResize` in its manifest; this is the browser spelling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>grimoire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
