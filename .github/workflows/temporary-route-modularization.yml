# Temporary, branch-only source relocation. Remove after success, no main changes.
name: Temporary Route Modularization
on:
  push:
    branches: [refactor/modularize-large-python]
    paths:
      - scripts/_temporary_modularize_routes.py
      - .github/workflows/temporary-route-modularization.yml
permissions:
  contents: write
jobs:
  split-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/modularize-large-python
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Python test, lint and type checkers
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pip check
      - name: Split modules into cohesive packages and preserve imports
        run: |
          python scripts/_temporary_modularize_routes.py
          python -m compileall -q backend/src/grimoire/routes
          git diff --check
          git status --short
      - name: Targeted contract and route-order tests
        run: |
          python -m pytest backend/tests/test_import_guard.py backend/tests/test_route_order.py backend/tests/test_llm_error_status.py backend/tests/test_pydantic_guard.py -q -x --tb=short
      - name: Commit WIP source modules for local continuation
        run: |
          git add -A backend/src/grimoire/routes backend/tests/test_llm_error_status.py
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "WIP(refactor): convert campaign routes and models to packages"
          git push origin HEAD:refactor/modularize-large-python
      - name: Document intentionally unfinished cleanup
        run: |
          echo "WIP split committed; requires per-module import cleanup, baseline migration, full test suite, and comprehensive guard review." >> "$GITHUB_STEP_SUMMARY"
