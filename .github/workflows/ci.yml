name: V2 core checks

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  merge_group:  # inert until a merge queue is enabled for v2 (docs/TESTING.md#ci-gate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    name: domain contracts (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -q

  # File replacement and path semantics differ by platform, and V1 isolation must
  # hold on each. Every cell must pass; see docs/TESTING.md#ci-gate.
  compat:
    name: compat (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13"]  # 3.11 on Ubuntu is the domain job
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -q
