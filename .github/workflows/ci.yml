name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Layered backend test pipeline per spec 17 §CI pipeline. Each layer
# runs as a discrete pytest invocation so failures surface where they
# happened. Layers fan out to one another only when the previous step
# passed.
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --frozen --all-extras --dev
        continue-on-error: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  backend-unit:
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: uv run pytest -m "not conformance and not integration and not frozen_campaign and not perf and not golden"

  backend-golden:
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      # Golden tests default to REPLAY mode and read checked-in fixtures.
      # Re-record locally with `uv run pytest -m golden --record`.
      - run: |
          uv run pytest -m golden || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  backend-conformance:
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      # Tolerate empty marker layers (pytest exit code 5) so the
      # pipeline doesn't break before later tasks populate each bucket.
      - run: |
          uv run pytest -m conformance || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-conformance
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: |
          uv run pytest -m integration || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  backend-frozen-campaign:
    runs-on: ubuntu-latest
    needs: backend-integration
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: |
          uv run pytest -m frozen_campaign || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  backend-perf:
    runs-on: ubuntu-latest
    needs: backend-frozen-campaign
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: |
          uv run pytest -m perf || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  backend-scenario:
    # L5 end-to-end scenarios are pre-release rather than per-commit
    # (spec 17 §L5): run on main pushes and manual dispatches only,
    # not on every pull_request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: backend-perf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: |
          uv run pytest -m scenario || code=$?
          [ "${code:-0}" = "5" ] && exit 0 || exit "${code:-0}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
        continue-on-error: true
      - run: pnpm install
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
