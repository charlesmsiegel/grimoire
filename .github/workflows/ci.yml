name: V2 core checks

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  merge_group:  # inert until a merge queue is enabled for v2 (docs/TESTING.md#ci-gate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    name: domain contracts (Python 3.11, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # The whole suite took 24 minutes here on a busy night (#647's first run, against about 12 on
    # an idle runner), so the domain job runs in the compat cells' five shards (docs/TESTING.md#ci-gate).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [store-explorations, explorations, sync, stores, rest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -q
        env:
          GRIMOIRE_TEST_SHARD: ${{ matrix.shard }}

  # File replacement and path semantics differ by platform, and V1 isolation must
  # hold on each. Every cell must pass; see docs/TESTING.md#ci-gate.
  compat:
    name: compat (${{ matrix.os }}, py${{ matrix.python }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The suite no longer fits one 30-minute job: the whole of it took 25-30 minutes on the Ubuntu
    # cells (Python 3.12 and 3.13) and Windows file I/O makes the crash explorations several times
    # slower still. So Ubuntu and Windows run in five shards that together cover every test file: the
    # store-backed crash explorations, the other crash and fault explorations, the replica-sync files,
    # the other store files, and the rest (tests/conftest.py; docs/TESTING.md#ci-gate). The Ubuntu
    # cells are the os x python x shard product; each include entry names another OS, so it adds a
    # cell of its own (macOS unsharded, Windows one per shard).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13"]  # 3.11 on Ubuntu is the domain job
        shard: [store-explorations, explorations, sync, stores, rest]
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
            shard: store-explorations
          - os: windows-latest
            python: "3.11"
            shard: explorations
          - os: windows-latest
            python: "3.11"
            shard: sync
          - os: windows-latest
            python: "3.11"
            shard: stores
          - os: windows-latest
            python: "3.11"
            shard: rest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -q
        env:
          GRIMOIRE_TEST_SHARD: ${{ matrix.shard }}
          # On Windows the hung-test traceback dump can itself crash Python (an access violation
          # while it walks a running thread's frames), and the slowest crash explorations take
          # over 120 s there on a busy runner, so Windows dumps only after 10 minutes
          # (docs/TESTING.md#ci-gate). The job timeout is still the hard stop.
          PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && '-o faulthandler_timeout=600' || '' }}
