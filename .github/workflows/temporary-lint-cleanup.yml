# Temporary one-shot branch workflow. Remove before promoting this branch.
# Uses only the existing Ruff/ESLint automatic safe fixes; no manual refactors.
name: Temporary Lint Debt Cleanup
on:
  push:
    branches: [refactor/lint-debt-cleanup]
permissions:
  contents: write
concurrency:
  group: temporary-lint-debt-cleanup
  cancel-in-progress: true
jobs:
  safe-autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/lint-debt-cleanup
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned lint toolchains
        run: |
          python -m pip install -e "./backend[dev]"
          cd frontend && npm ci
      - name: Apply built-in safe fixes only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lint-debt
          set +e
          python -m ruff check . --fix --no-cache --output-format json > build/lint-debt/ruff-remaining.json
          ruff_code=$?
          (cd frontend && npx --no-install eslint . --fix --format json) > build/lint-debt/eslint-remaining.json
          eslint_code=$?
          set -e
          printf 'ruff exit: %s; eslint exit: %s\n' "$ruff_code" "$eslint_code"
          test "$ruff_code" -le 1
          test "$eslint_code" -le 1
          git diff --check
          git diff --stat
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          base=Path("build/lint-debt")
          ruff=json.loads((base/"ruff-remaining.json").read_text())
          eslint=json.loads((base/"eslint-remaining.json").read_text())
          rc=collections.Counter(x.get("code","unknown") for x in ruff)
          ec=collections.Counter(x.get("ruleId") or "unknown" for file in eslint for x in file["messages"])
          print("RUFF REMAINING:", len(ruff), rc.most_common(24))
          print("ESLINT REMAINING:", sum(ec.values()), ec.most_common(24))
          PY
      - name: Lower baselines without permitting regressions
        run: |
          python scripts/ratchet.py ruff --update
          python scripts/ratchet.py mypy --update
          python scripts/ratchet.py eslint --update
      - name: Verify lint and types
        run: |
          make check-lint PY=python
          make check-mypy PY=python
          make check-eslint PY=python
          (cd frontend && npm run typecheck)
          python -m compileall -q backend/src scripts
          git diff --check
      - name: Test Python and frontend behavior
        run: |
          make check-web
          make check-py PY=python
      - name: Commit strictly tool-generated fixes to the cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "No safe mechanical fixes found."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(lint): apply safe automated Ruff and ESLint fixes [skip ci]"
          git push origin HEAD:refactor/lint-debt-cleanup
      - name: Audit summary
        if: always()
        shell: bash
        run: |
          echo "Lint autofix results; inspect the artifacts and remaining findings before any manually authored changes." >> "$GITHUB_STEP_SUMMARY"
          for tool in ruff mypy eslint; do
            if test -f "lint-baselines/$tool.json"; then
              python - "$tool" <<'PY'
          import json,sys
          x=json.load(open("lint-baselines/"+sys.argv[1]+".json"))
          print(sys.argv[1],sum(sum(v.values()) for v in x.values()),"findings remaining")
          PY
            fi
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-cleanup-safe-autofix
          path: |
            build/lint-debt/*.json
            lint-baselines/*.json
          retention-days: 30
          if-no-files-found: warn
