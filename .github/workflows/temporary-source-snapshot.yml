# Temporary snapshot for behavior-preserving source modularization. Remove before PR.
name: Temporary Source Snapshot
on:
  push:
    branches: [refactor/modularize-large-python]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Copy source and tests without Git metadata
        run: |
          mkdir -p build/snapshot
          tar -czf build/snapshot/grimoire-source.tgz \
            backend/src backend/tests backend/pyproject.toml \
            frontend/src frontend/package.json frontend/package-lock.json \
            scripts lint-baselines .github Makefile mypy.ini \
            README.md CLAUDE.md AGENTS.md \
            docs/superpowers/specs
          ls -lh build/snapshot/grimoire-source.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grimoire-source-modularization
          path: build/snapshot/grimoire-source.tgz
          retention-days: 7
